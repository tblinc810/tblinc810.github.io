<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamBox – Video Player</title>
  <meta name="description" content="Play any direct video URL instantly. Supports MP4, MKV, WebM, HLS and more." />

  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS v3 (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['attribute', '[data-theme="dark"]'],
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui'],
          },
          colors: {
            accent:  '#6c63ff',
            accent2: '#ff6b6b',
            surf:    '#ffffff',
            surf2:   '#edf2f9',
          },
          boxShadow: {
            glow: '0 0 22px rgba(108,99,255,0.35)',
            'glow-lg': '0 8px 32px rgba(108,99,255,0.6)',
          },
          keyframes: {
            blink: {
              '0%,100%': { opacity: '1', transform: 'scale(1)' },
              '50%':      { opacity: '0.4', transform: 'scale(1.4)' },
            },
          },
          animation: {
            blink: 'blink 1.8s ease-in-out infinite',
          },
        },
      },
    };
  </script>

  <!-- Video.js v8 -->
  <link href="https://vjs.zencdn.net/8.21.1/video-js.min.css" rel="stylesheet" />

  <!-- Custom design-system overrides (CSS vars, dark theme, player styles) -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="page" id="page">

  <!-- Header -->
  <header id="header">
    <div class="logo-icon">
      <i data-lucide="play" style="width:20px;height:20px;stroke:#fff;fill:#fff;"></i>
    </div>
    <span class="logo-text">StreamBox</span>
    <span class="logo-tag">Native Player</span>
    <button class="theme-toggle" id="themeToggle" title="Switch Theme">
      <i data-lucide="moon" id="themeIcon" style="width:14px;height:14px;"></i>
      <span id="themeLabel">Dark Mode</span>
    </button>
  </header>

  <!-- URL input card -->
  <div class="url-card" id="urlCard">
    <div class="url-label">Video URL</div>
    <div class="url-row">
      <div class="url-wrap">
        <span class="url-icon">
          <i data-lucide="link-2" style="width:15px;height:15px;"></i>
        </span>
        <input id="urlInput" type="url" placeholder="Paste video URL here…" autocomplete="off" spellcheck="false" />
        <button class="x-btn" id="xBtn" aria-label="Clear">
          <i data-lucide="x" style="width:13px;height:13px;"></i>
        </button>
      </div>
      <button id="playBtn">
        <i data-lucide="play" style="width:16px;height:16px;stroke:#fff;fill:#fff;"></i>
        Play
      </button>
    </div>
    <div class="chips">
      <span class="chip">MP4</span><span class="chip">MKV</span>
      <span class="chip">WebM</span><span class="chip">AVI</span>
      <span class="chip">MOV</span><span class="chip">TS</span>
      <span class="chip">FLV</span><span class="chip">WMV</span>
      <span class="chip">OGG</span><span class="chip">HLS .m3u8</span>
      <span class="chip">DASH .mpd</span>
    </div>
  </div>

  <!-- Error banner -->
  <div class="err" id="errBox">
    <i data-lucide="alert-circle" style="width:17px;height:17px;flex-shrink:0;margin-top:1px;"></i>
    <div id="errMsg"></div>
  </div>

  <!-- Player -->
  <div id="playerWrap" class="is-empty">
    <!-- Empty State -->
    <div id="emptyState" class="empty-state">
      <i data-lucide="tv" style="width:48px;height:48px;stroke:var(--muted);margin-bottom:12px;display:block;"></i>
      <div class="empty-title">StreamBox TV System</div>
      <div class="empty-sub">Paste a direct video link above to get started</div>
    </div>

    <!-- Video.js element — controls hidden, we use our custom bar -->
    <video
      id="vid"
      class="video-js vjs-streambox"
      preload="auto"
      playsinline
      webkit-playsinline
    ></video>

    <!-- Double-tap seek flash overlays (mobile) -->
    <div class="dbl-tap-flash left"  id="flashLeft">&#8722;10s</div>
    <div class="dbl-tap-flash right" id="flashRight">+10s</div>

    <!-- Custom control bar -->
    <div class="ctrl-bar">
      <!-- Seek bar -->
      <div class="seek-wrap" id="seekWrap">
        <div class="seek-buf"  id="seekBuf"></div>
        <div class="seek-prog" id="seekProg"></div>
        <div class="seek-thumb" id="seekThumb"></div>
      </div>

      <!-- Controls row -->
      <div class="ctrl-row">
        <!-- Play/Pause -->
        <button class="ctrl-btn" id="ppBtn" title="Play / Pause">
          <i data-lucide="play" id="ppIcon" style="width:20px;height:20px;fill:currentColor;"></i>
        </button>

        <!-- Skip back 10s -->
        <button class="ctrl-btn" id="rewBtn" title="Back 10s">
          <i data-lucide="rotate-ccw" style="width:20px;height:20px;"></i>
        </button>

        <!-- Skip forward 10s -->
        <button class="ctrl-btn" id="fwdBtn" title="Forward 10s">
          <i data-lucide="rotate-cw" style="width:20px;height:20px;"></i>
        </button>

        <!-- Time -->
        <span class="time" id="timeDisp">0:00 / 0:00</span>

        <span class="spacer"></span>

        <!-- Volume -->
        <div class="vol-wrap">
          <button class="ctrl-btn" id="muteBtn" title="Mute">
            <i data-lucide="volume-2" id="volIcon" style="width:20px;height:20px;"></i>
          </button>
          <input class="vol-slider" id="volSlider" type="range" min="0" max="1" step="0.02" value="1" />
        </div>

        <!-- Speed -->
        <button class="speed-btn" id="speedBtn" title="Playback speed">1×</button>

        <!-- PiP -->
        <button class="ctrl-btn" id="pipBtn" title="Picture in Picture">
          <i data-lucide="picture-in-picture-2" style="width:20px;height:20px;"></i>
        </button>

        <!-- Fullscreen -->
        <button class="ctrl-btn" id="fsBtn" title="Fullscreen">
          <i data-lucide="maximize" id="fsIcon" style="width:20px;height:20px;"></i>
        </button>
      </div>
    </div>

    <!-- Info strip -->
    <div class="info-strip">
      <span class="live-dot"></span>
      <span class="info-url" id="infoUrl"></span>
      <span class="fmt-badge" id="fmtBadge">VIDEO</span>
    </div>
  </div>

  <footer>Powered by <b>Native HTML5 Video</b> · StreamBox</footer>
</div>

<!-- Mobile swipe volume indicator -->
<div id="volIndicator">
  <i data-lucide="volume-2" style="width:20px;height:20px;stroke:#fff;"></i>
  <span id="volPct">100%</span>
</div>

<!-- Motion (motion.dev vanilla) -->
<script type="module">
  import { animate, inView, stagger } from 'https://cdn.jsdelivr.net/npm/motion@latest/+esm';

  /* ── Lucide init (after DOM is ready) ── */
  lucide.createIcons();

  /* ─────────────────────────────────────────────
     Entrance animations
  ───────────────────────────────────────────── */

  // Header slides in from top
  animate('#header',
    { opacity: [0, 1], y: [-28, 0] },
    { duration: 0.55, easing: [0.22, 1, 0.36, 1] }
  );

  // URL card fades + rises slightly, staggered after header
  animate('#urlCard',
    { opacity: [0, 1], y: [24, 0], scale: [0.97, 1] },
    { duration: 0.55, delay: 0.12, easing: [0.22, 1, 0.36, 1] }
  );

  // Chips stagger in
  animate('.chip',
    { opacity: [0, 1], y: [10, 0] },
    { duration: 0.35, delay: stagger(0.04, { start: 0.3 }), easing: 'ease-out' }
  );

  /* ─────────────────────────────────────────────
     Player wrapper — animate when it becomes visible
  ───────────────────────────────────────────── */
  inView('#playerWrap', ({ target }) => {
    animate(target,
      { opacity: [0, 1], y: [30, 0], scale: [0.97, 1] },
      { duration: 0.5, delay: 0.24, easing: [0.22, 1, 0.36, 1] }
    );
  }, { amount: 0.1 });

  /* ─────────────────────────────────────────────
     Button press micro-animations
  ───────────────────────────────────────────── */
  function addPressAnim(selector) {
    document.querySelectorAll(selector).forEach(btn => {
      btn.addEventListener('pointerdown', () => {
        animate(btn, { scale: 0.88 }, { duration: 0.1, easing: 'ease-out' });
      });
      btn.addEventListener('pointerup', () => {
        animate(btn, { scale: 1 }, { duration: 0.25, easing: [0.34, 1.56, 0.64, 1] });
      });
      btn.addEventListener('pointerleave', () => {
        animate(btn, { scale: 1 }, { duration: 0.2, easing: 'ease-out' });
      });
    });
  }

  addPressAnim('#playBtn');
  addPressAnim('#ppBtn');
  addPressAnim('#rewBtn');
  addPressAnim('#fwdBtn');
  addPressAnim('#muteBtn');
  addPressAnim('#pipBtn');
  addPressAnim('#fsBtn');
  addPressAnim('#speedBtn');
  addPressAnim('#themeToggle');

  /* ─────────────────────────────────────────────
     Play button shimmer on hover (glow pulse)
  ───────────────────────────────────────────── */
  const playBtn = document.getElementById('playBtn');
  playBtn.addEventListener('mouseenter', () => {
    animate(playBtn,
      { boxShadow: ['0 4px 22px rgba(108,99,255,.45)', '0 6px 36px rgba(108,99,255,.85)', '0 4px 22px rgba(108,99,255,.45)'] },
      { duration: 0.9, repeat: Infinity, easing: 'ease-in-out' }
    );
  });
  playBtn.addEventListener('mouseleave', () => {
    animate(playBtn,
      { boxShadow: '0 4px 22px rgba(108,99,255,.45)' },
      { duration: 0.3 }
    );
  });

  /* ─────────────────────────────────────────────
     Logo icon continuous gentle spin on hover
  ───────────────────────────────────────────── */
  const logoIcon = document.querySelector('.logo-icon');
  logoIcon.addEventListener('mouseenter', () => {
    animate(logoIcon, { rotate: 360 }, { duration: 0.6, easing: [0.22, 1, 0.36, 1] });
  });

  /* ─────────────────────────────────────────────
     Error banner animate in/out
  ───────────────────────────────────────────── */
  const errBox = document.getElementById('errBox');
  const observer = new MutationObserver(() => {
    if (errBox.classList.contains('on')) {
      animate(errBox, { opacity: [0, 1], x: [0, -6, 6, -4, 4, 0], y: [-6, 0] }, { duration: 0.4 });
    }
  });
  observer.observe(errBox, { attributes: true, attributeFilter: ['class'] });

  /* ─────────────────────────────────────────────
     Seek thumb pop on hover (CSS handles hover,
     Motion adds the scale spring on seek start)
  ───────────────────────────────────────────── */
  const seekThumb = document.getElementById('seekThumb');
  const seekWrap  = document.getElementById('seekWrap');
  seekWrap.addEventListener('mouseenter', () => {
    animate(seekThumb, { scale: 1 }, { duration: 0.15 });
  });

  /* ─────────────────────────────────────────────
     Theme toggle icon spin on click
  ───────────────────────────────────────────── */
  document.getElementById('themeToggle').addEventListener('click', () => {
    animate('#themeIcon', { rotate: [0, 180] }, { duration: 0.4, easing: [0.22, 1, 0.36, 1] });
    // Re-init lucide after theme JS swaps innerHTML
    setTimeout(() => lucide.createIcons(), 50);
  });
</script>

<!-- Video.js JS -->
<script src="https://vjs.zencdn.net/8.21.1/video.min.js"></script>

<script src="assist/player.js"></script>
</body>
</html>
