<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamBox – Video Player</title>
  <meta name="description" content="Play any direct video URL instantly. Supports MP4, MKV, WebM, HLS and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="page">

  <!-- Header -->
  <header>
    <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    <span class="logo-text">StreamBox</span>
    <span class="logo-tag">Native Player</span>
    <button class="theme-toggle" id="themeToggle" title="Switch Theme">
      <svg id="themeIcon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
      <span id="themeLabel">Dark Mode</span>
    </button>
  </header>

  <!-- URL input card -->
  <div class="url-card">
    <div class="url-label">Video URL</div>
    <div class="url-row">
      <div class="url-wrap">
        <span class="url-icon">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
          </svg>
        </span>
        <input id="urlInput" type="url" placeholder="Paste video URL here…" autocomplete="off" spellcheck="false" />
        <button class="x-btn" id="xBtn" aria-label="Clear">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <button id="playBtn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        Play
      </button>
    </div>
    <div class="chips">
      <span class="chip">MP4</span><span class="chip">MKV</span>
      <span class="chip">WebM</span><span class="chip">AVI</span>
      <span class="chip">MOV</span><span class="chip">TS</span>
      <span class="chip">FLV</span><span class="chip">WMV</span>
      <span class="chip">OGG</span><span class="chip">HLS .m3u8</span>
      <span class="chip">DASH .mpd</span>
    </div>

  </div>

  <!-- Error banner -->
  <div class="err" id="errBox">
    <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <div id="errMsg"></div>
  </div>

  <!-- Player -->
  <div id="playerWrap">

    <!-- Native HTML5 video — no crossorigin attribute → no CORS block -->
    <video id="vid" preload="auto"></video>

    <!-- Custom control bar -->
    <div class="ctrl-bar">
      <!-- Seek bar -->
      <div class="seek-wrap" id="seekWrap">
        <div class="seek-buf"  id="seekBuf"></div>
        <div class="seek-prog" id="seekProg"></div>
        <div class="seek-thumb" id="seekThumb"></div>
      </div>

      <!-- Controls row -->
      <div class="ctrl-row">
        <!-- Play/Pause -->
        <button class="ctrl-btn" id="ppBtn" title="Play / Pause">
          <svg id="ppIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <!-- Skip back 10s -->
        <button class="ctrl-btn" id="rewBtn" title="Back 10s">
          <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05 1-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
        </button>

        <!-- Skip forward 10s -->
        <button class="ctrl-btn" id="fwdBtn" title="Forward 10s">
          <svg viewBox="0 0 24 24"><path d="M18 8l-4-4v3c-3.86 0-7 3.14-7 7s3.14 7 7 7 7-3.14 7-7h-2c0 2.76-2.24 5-5 5s-5-2.24-5-5 2.24-5 5-5v3l4-4z"/></svg>
        </button>

        <!-- Time -->
        <span class="time" id="timeDisp">0:00 / 0:00</span>

        <span class="spacer"></span>

        <!-- Volume -->
        <div class="vol-wrap">
          <button class="ctrl-btn" id="muteBtn" title="Mute">
            <svg id="volIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
          </button>
          <input class="vol-slider" id="volSlider" type="range" min="0" max="1" step="0.02" value="1" />
        </div>

        <!-- Speed -->
        <button class="speed-btn" id="speedBtn" title="Playback speed">1×</button>

        <!-- PiP -->
        <button class="ctrl-btn" id="pipBtn" title="Picture in Picture">
          <svg viewBox="0 0 24 24"><path d="M19 7h-8v6h8V7zm2-4H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14z"/></svg>
        </button>

        <!-- Fullscreen -->
        <button class="ctrl-btn" id="fsBtn" title="Fullscreen">
          <svg id="fsIcon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
      </div>
    </div>

    <!-- Info strip -->
    <div class="info-strip">
      <span class="live-dot"></span>
      <span class="info-url" id="infoUrl"></span>
      <span class="fmt-badge" id="fmtBadge">VIDEO</span>
    </div>
  </div>

  <footer>Powered by <b>Native HTML5 Video</b> · StreamBox</footer>
</div>

<script src="assist/player.js"></script>
</body>
</html>
